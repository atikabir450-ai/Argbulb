<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lightbulb ON/OFF</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <!-- Left Side - Light Bulb -->
    <div class="bulb-section">
      <div class="wire"></div>

      <div class="wire-connection"></div>

      <div class="top-socket"></div>
      <div class="socket-back"></div>
      <div class="bottom-socket"></div>

      <div class="bulb">
        <div class="bulb-top"></div>
        <div class="bulb-bottom"></div>
      </div>
    </div>

    <!-- Right Side - Switch -->
    <div class="switch-section">
      <div class="switch-cover">
        <span class="screw top"></span>

        <button class="switch-button" aria-label="Toggle Light"></button>

        <span class="screw bottom"></span>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
